<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chico Business - IA</title>
<style>
body{font-family:sans-serif;background:#0f172a;color:white;text-align:center;padding:20px;margin:0}
h1{font-size:32px;margin-bottom:5px}
p{color:#cbd5e1;font-size:18px}
.box{background:white;color:#0f172a;padding:20px;border-radius:15px;max-width:500px;margin:20px auto;text-align:left}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #ccc;font-size:16px;box-sizing:border-box}
button{background:#22c55e;color:white;border:0;padding:12px 15px;border-radius:10px;font-size:16px;font-weight:bold;margin-top:10px;width:100%;cursor:pointer}
.quick{display:flex;gap:8px;margin-top:10px}
.quick button{background:#e2e8f0;color:#0f172a;font-size:14px;padding:8px;margin:0}
#reponse{margin-top:15px;font-weight:bold;color:#0f172a;line-height:1.5;font-size:16px;background:#f1f5f9;padding:12px;border-radius:10px;min-height:40px}
small{color:#94a3b8}
</style>
</head>
<body>
<h1>🤖 Chico Business IA</h1>
<p>Ton assistant business à Kinshasa</p>
<div class="box">
<p style="margin:0 0 5px;color:#0f172a;font-weight:bold">Pose ta question :</p>
<input id="q" placeholder="Ex: Comment vendre plus ?">
<div class="quick">
<button onclick="rapide('vendre')">💰 Vendre</button>
<button onclick="rapide('prix')">🏷️ Prix</button>
<button onclick="rapide('clients')">👥 Clients</button>
</div>
<button onclick="repondre()">Demander à Chico</button>
<div id="reponse">Ta réponse va s'afficher ici...</div>
</div>
<small>Chico Business - Fait à Kinshasa 🇨🇩</small>
<script>
function rapide(mot){document.getElementById('q').value=mot;repondre();}
function repondre(){
let q=document.getElementById('q').value.toLowerCase();
let r=document.getElementById('reponse');
if(q.includes('vendre')||q.includes('vente')){r.innerHTML="💰 <b>Pour vendre plus :</b><br>1. Poste 1 vidéo TikTok par jour<br>2. Mets ton WhatsApp dans ta bio<br>3. Propose une offre du jour (-10%)<br>4. Réponds aux clients en moins de 5 min";}
else if(q.includes('prix')||q.includes('coute')||q.includes('coûte')){r.innerHTML="🏷️ <b>Pour ton prix :</b><br>Calcule : Coût + Transport + Ton bénéfice.<br>Ex: Si ça te coûte 10$, vends à 18$ - 20$. Ne vends jamais trop bas, les gens doutent de la qualité.";}
else if(q.includes('client')||q.includes('trouver')){r.innerHTML="👥 <b>Pour trouver des clients :</b><br>1. Va dans 3 groupes WhatsApp / Facebook de Kinshasa<br>2. Montre ton produit en vidéo<br>3. Demande à tes 5 premiers clients de te recommander";}
else if(q.includes('bonjour')||q.includes('salut')){r.innerHTML="👋 Salut ! Je suis Chico. Demande-moi comment vendre, fixer ton prix ou trouver des clients.";}
else if(q==="" ){r.innerHTML="⚠️ Écris d'abord ta question !";}
else{r.innerHTML="💡 <b>Conseil Chico :</b><br>Commence petit, vends tous les jours, et utilise WhatsApp + TikTok. La constance bat le talent. Tu veux un conseil pour vendre, prix ou clients ?";}
}
</script>
</body>
</html>
